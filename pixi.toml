[workspace]
authors = ["danielduberg <danielduberg@gmail.com>"]
channels = ["conda-forge"]
name = "wasp_autonomous_systems"
version = "0.1.0"
platforms = ["linux-64", "win-64", "osx-64", "osx-arm64", "linux-aarch64"]

# This will automatically activate the ros workspace on activation
[target.win.activation]
scripts = ["install/setup.bat"]

[target.unix.activation]
# For activation scripts, we use bash for Unix-like systems
scripts = ["install/setup.bash"]

[dependencies]
python = "*"
# Build tools
compilers = "*"
cmake = "*"
pkg-config = "*"
make = "*"
ninja = "*"
# ROS specific tools
rosdep = "*"
colcon-common-extensions = "*"
setuptools = "==70.3.0"
# Assignment 3
kdtree = ">=0.16,<0.17"
transforms3d = ">=0.4.2,<0.5"
ultralytics = ">=8.3.234,<9"
pytorch-cpu = "==2.7"
torchvision = "==0.22"
openvino = ">=2025.0.0,<2026"
nncf = ">=2.5.0,<3"
opencv = ">=4.11.0,<5"
zstd = ">=1.5.7,<2"
pyqtgraph = ">=0.14.0,<0.15"

# [pypi-dependencies]
# pv = {  }

[target.linux.dependencies]
libgl-devel = ">=1.7.0,<2"

# TODO: Make sure to source after build

[target.win-64.tasks]
build = { cmd = "colcon build --merge-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython3_FIND_VIRTUALENV=ONLY", inputs = [
	"src/**/*",
	"setup.py",
	"setup.cfg",
], outputs = [
	"install/**/*",
] }

[target.unix.tasks]
build = { cmd = "colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython3_FIND_VIRTUALENV=ONLY", inputs = [
	"src/**/*",
	"setup.py",
	"setup.cfg",
], outputs = [
	"install/**/*",
] }


[tasks]
clear_workspace = { cmd = "rm -r build install log" }

download_rosbags = { cmd = 'curl -fSL "https://canvas.kth.se/files/9471655/download?download_frd=1&verifier=4wOMCwu3QHS0duQGTKpn6HyhO9jCPGZSL3RM9kmu" | tar --use-compress-program=unzstd -x', outputs = [
	"rosbags/kitti/kitti_*.mcap",
	"rosbags/kitti/metadata.yaml",
	"rosbags/real_robot/real_robot_*.mcap",
	"rosbags/real_robot/metadata.yaml",
] }

# Assignment 1 tasks

ass_1_1 = { cmd = '''
ros2 launch assignment_1 turtlebot_simulation_launch.py
& rviz2 -d src/assignment_1/rviz/turtlebot_simulation.rviz --ros-args -p use_sim_time:=true
''' }

ass_1_2 = { cmd = '''
ros2 bag play --read-ahead-queue-size 100 -l -r 1.0 --clock 100 rosbags/real_robot
& rviz2 -d src/assignment_1/rviz/real_robot.rviz --ros-args -p use_sim_time:=true
''' }

ass_1_3 = { cmd = '''
ros2 bag play --read-ahead-queue-size 100 -l -r 1.0 --clock 100 rosbags/kitti
& rviz2 -d src/assignment_1/rviz/kitti.rviz --ros-args -p use_sim_time:=true
& ros2 launch wasp_autonomous_systems kitti_car_launch.py
''' }

# Assignment 2 tasks

ass_2_1 = { cmd = '''
ros2 run assignment_2 odometry --ros-args -p use_sim_time:=true
& ros2 bag play --read-ahead-queue-size 100 -l -r 1.0 --clock 100 -p rosbags/real_robot
& rviz2 -d src/assignment_2/rviz/odometry.rviz --ros-args -p use_sim_time:=true
''' }

ass_2_2 = { cmd = '''
ros2 launch assignment_2 collision_detection_launch.py
& rviz2 -d src/assignment_2/rviz/collision_detection.rviz --ros-args -p use_sim_time:=true
& pixi run ros2 run rqt_plot rqt_plot /imu/linear_acceleration
& ros2 run assignment_2 collision_detection --ros-args -p use_sim_time:=true
& ros2 run wasp_autonomous_systems autonomous_controller --ros-args -p use_sim_time:=true
''' }

ass_2_3 = { cmd = '''
ros2 run assignment_2 segmentation --ros-args -r /image:=/kitti/camera/color/left/image -p use_sim_time:=true
& ros2 bag play --read-ahead-queue-size 100 -l -r 1.0 --clock 100 -p rosbags/kitti
& rviz2 -d src/assignment_2/rviz/kitti_segmentation.rviz --ros-args -p use_sim_time:=true
& ros2 launch wasp_autonomous_systems kitti_car_launch.py
''' }

ass_2_4 = { cmd = '''
ros2 run assignment_2 camera --ros-args -p framerate:=10.0 -p image_height:=480 -p image_width:=640
& ros2 run assignment_2 segmentation
& rqt --perspective-file src/assignment_2/rqt/camera_segmentation.perspective
''' }

# Assignment 3 tasks

ass_3_planner = { cmd = 'ros2 run assignment_3 path_planner' }

ass_3_viewer = { cmd = '''
rviz2 -d $PIXI_PROJECT_ROOT/src/assignment_3/rviz/planning.rviz
& ros2 run rqt_reconfigure rqt_reconfigure /path_planner
''' }

ass_3 = [{ task = "ass_3_planner" }, { task = "ass_3_viewer" }]


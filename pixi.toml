[workspace]
name = "wasp_autonomous_systems"
authors = ["Daniel Duberg <danielduberg@gmail.com>"]
channels = [
	"https://prefix.dev/pixi-build-backends",
	"https://prefix.dev/conda-forge",
	"https://prefix.dev/robostack-jazzy",
]
version = "0.1.0"
platforms = [
	"osx-arm64",
	"linux-64",
	# "win-64", # TODO: disabled pending Windows verification. The original reason
	# here (needing Jazzy for Gazebo support) is now moot - Gazebo isn't used by
	# any assignment anymore (see the Webots migration, commit a969193) - but that
	# doesn't mean Humble+Webots works on Windows: the patched webots_ros2_driver
	# has only been build-tested on macOS/Linux, never Windows.
	# "linux-aarch64",
]
preview = ["pixi-build"]

[dependencies]
# ROS
# ros-jazzy-ros2run = ">=0.32.6,<0.33"
ros-jazzy-desktop = "*"
# colcon's ament_python build extension still invokes the old-style
# `setup.py develop --editable` command, which setuptools removed (a
# common ROS2-ecosystem pain point) - needed for `colcon build`/
# `pixi run build` (the local install/ workspace, separate from the
# pixi-build-ros conda packages above) to keep working. Narrow compatible
# window: robostack-jazzy's default (84.0.0) and anything <81 still lack
# --editable; anything <66 breaks on Python 3.12 (pkgutil.ImpImporter was
# removed). 69.2.0 is a known-good pin inside that window.
setuptools = "==69.2.0"
colcon-ros = "*"
# Course packages
ros-jazzy-wasp-as-ass-1 = { path = "src/wasp_as_ass_1" }
ros-jazzy-wasp-as-ass-2 = { path = "src/wasp_as_ass_2" }
ros-jazzy-wasp-as-ass-3 = { path = "src/wasp_as_ass_3" }
ros-jazzy-wasp-as-ass-4 = { path = "src/wasp_as_ass_4" }
ros-jazzy-wasp-as = { path = "src/wasp_as" }
ros-jazzy-wasp-as-interfaces = { path = "src/wasp_as_interfaces" }
# Webots simulator (replaces Gazebo, which segfaults on macOS for any
# camera/lidar-equipped robot - see README's "Known issues on macOS")
ros-jazzy-webots-ros2-driver = { path = "src/webots_ros2_driver" }
ros-jazzy-webots-ros2-msgs = { path = "src/webots_ros2_msgs" }
ros-jazzy-webots-ros2-importer = { path = "src/webots_ros2_importer" }
ros-jazzy-webots-ros2-control = { path = "src/webots_ros2_control" }
ros-jazzy-wasp-as-webots = { path = "src/wasp_as_webots" }
# To decompress rosbags
zstd = ">=1.5.7,<2"

# This will automatically activate the ros workspace on activation
[target.win.activation]
scripts = ["install/setup.bat"]

[target.unix.activation]
scripts = ["install/setup.sh", "packaging/webots_env_activation.sh"]

# To build you can use - `pixi run -e <ros distro> build <Any other temporary args>`
[feature.build.target.win-64.tasks]
build = "colcon build --merge-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"

[feature.build.target.unix.tasks]
build = "colcon build --symlink-install --cmake-args -DCMAKE_EXPORT_COMPILE_COMMANDS=ON -DPython_FIND_VIRTUALENV=ONLY -DPython3_FIND_VIRTUALENV=ONLY"

[tasks]
download_rosbags = { cmd = 'curl -fSL "https://canvas.kth.se/files/9471655/download?download_frd=1&verifier=4wOMCwu3QHS0duQGTKpn6HyhO9jCPGZSL3RM9kmu" | tar --use-compress-program=unzstd -x', outputs = [
	"rosbags/kitti/kitti_*.mcap",
	"rosbags/kitti/metadata.yaml",
	"rosbags/real_robot/real_robot_*.mcap",
	"rosbags/real_robot/metadata.yaml",
] }

# Dev tasks

build = "colcon build --symlink-install --cmake-args -DPython_EXECUTABLE=$CONDA_PREFIX/bin/python -DPython3_EXECUTABLE=$CONDA_PREFIX/bin/python -DPYTHON_EXECUTABLE=$CONDA_PREFIX/bin/python -DPython3_FIND_STRATEGY=LOCATION -DPython_FIND_STRATEGY=LOCATION"

# Assignment 1 tasks

ass_1_1 = { cmd = "bash -c '. ./packaging/webots_env_activation.sh && exec ros2 launch wasp_as_ass_1 turtlebot_apartment_launch.py'" }
# Run in a second terminal alongside ass_1_1 to manually drive the robot
# around the apartment (i/j/k/l etc. - the tool prints its own key list).
# No Webots-specific setup needed here, so no activation wrapper.
# stamped:=true matches Jazzy's diff_drive_controller, which only accepts
# TwistStamped on ~/cmd_vel (use_stamped_vel was removed - see
# ros2control.yaml). key_timeout/repeat_rate:=0.0 disable timeout-based
# repeat-publishing for predictable manual control; use_sim_time:=true
# matches ass_1_1's Webots clock, matching the assignment description.
ass_1_1_teleop = { cmd = "ros2 run teleop_twist_keyboard teleop_twist_keyboard --ros-args -p stamped:=true -p key_timeout:=0.0 -p repeat_rate:=0.0 -p use_sim_time:=true" }
ass_1_2 = { cmd = "ros2 launch wasp_as_ass_1 real_robot_launch.xml rate:={{ rate }}", args = [{ arg = "rate", default = "1.0" }] }
ass_1_3 = { cmd = "ros2 launch wasp_as_ass_1 kitti_launch.xml rate:={{ rate }}", args = [{ arg = "rate", default = "1.0" }] }

# Assignment 2 tasks

ass_2_1 = { cmd = "ros2 launch wasp_as_ass_2 odometry_launch.xml rate:={{ rate }}", args = [{ arg = "rate", default = "1.0" }] }
ass_2_2 = { cmd = "bash -c '. ./packaging/webots_env_activation.sh && exec ros2 launch wasp_as_ass_2 collision_detection_webots_launch.py'" }
ass_2_3 = { cmd = "ros2 launch wasp_as_ass_2 kitti_segmentation_launch.xml rate:={{ rate }}", args = [{ arg = "rate", default = "1.0" }] }
# camera_segmentation_launch.xml is genuinely empty (0 bytes) as of the
# course maintainer's own commit 6bb15ea - not migration fallout, no
# working version found anywhere in git history or the other local clone.
# This task will not do anything useful until that launch file is authored.
ass_2_4 = { cmd = "ros2 launch wasp_as_ass_2 camera_segmentation_launch.xml" }

# Assignment 3 tasks

ass_3 = { cmd = "ros2 launch wasp_as_ass_3 planning_launch.xml" }
ass_3_planner = { cmd = "ros2 run wasp_as_ass_3 path_planner" }
ass_3_gui = { cmd = "ros2 launch wasp_as_ass_3 gui_launch.xml" }

# Assignment 4 tasks

ass_4_manual = { cmd = "bash -c '. ./packaging/webots_env_activation.sh && exec ros2 launch wasp_as_ass_4 manual_launch.xml'" }
ass_4_hold = { cmd = "bash -c '. ./packaging/webots_env_activation.sh && exec ros2 launch wasp_as_ass_4 hold_launch.xml'" }
ass_4_pid = { cmd = "bash -c '. ./packaging/webots_env_activation.sh && exec ros2 launch wasp_as_ass_4 pid_launch.xml'" }

# Elective tasks

# Elective task A: Dynamic Object Detection, camera and LiDAR fusion.
# yolo_model options per the assignment description: "openvino_int8"
# (default), "openvino_half", "torch" - switch to compare performance.
# downsample_voxel_size/num_clouds_accum are meant to be tuned live via the
# bundled rqt_reconfigure panel instead, matching the assignment's own
# "change this at runtime" note.
ass_elective_a = { cmd = "ros2 launch wasp_as_ass_2 kitti_segmentation_extra_launch.xml rate:={{ rate }} yolo_model:={{ yolo_model }}", args = [
	{ arg = "rate", default = "1.0" },
	{ arg = "yolo_model", default = "openvino_int8" },
] }
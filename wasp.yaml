write_files:

- content: |

    [[ -z "${COLCON_HOME}" ]] && export COLCON_HOME="$HOME/.colcon"

    [[ -z "${XAUTHORITY}" ]] && export XAUTHORITY=$HOME/.Xauthority
    
    # Source Python virtual environment
    if [ -f /home/ubuntu/ros2_ws/venv/bin/activate ]; then
      source /home/ubuntu/ros2_ws/venv/bin/activate
    fi

    # Source ROS
    if [ -f /opt/ros/jazzy/setup.bash ]; then
      source /opt/ros/jazzy/setup.bash
    fi

    if [ -f /usr/share/colcon_argcomplete/hook/colcon-argcomplete.bash ]; then
      source /usr/share/colcon_argcomplete/hook/colcon-argcomplete.bash
    fi

    # Source local ROS workspace
    if [ -f /home/ubuntu/ros2_ws/install/local_setup.bash ]; then
      source /home/ubuntu/ros2_ws/install/local_setup.bash
    fi

    # Alias for building ROS workspace with symbolic links
    alias cbs="colcon build --symlink-install"

    # Make sure that you can execute the newly installed programs by adding your local bin folder to the PATH
    export PATH="/home/ubuntu/.local/bin:$PATH"

    # Make sure ROS only communicates over localhost
    export ROS_AUTOMATIC_DISCOVERY_RANGE=LOCALHOST
    
    # Tell Webots what shared folder to use
    
    top="┏━━━━━━━━━━━━━━━━━  PLEASE NOTE ━━━━━━━━━━━━━━━━━┓"
    middle="┃                                                ┃"
    bottom="┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛"
    t1="┃      Could not find host-shared directory.     ┃"
    t2="┃      Please re-mount the shared directory.     ┃"
    
    if [ -d /home/ubuntu/shared ]; then
      if [ ! -d /home/ubuntu/shared/webots ]; then
        mkdir /home/ubuntu/shared/webots
      fi
      host_dir=$(mount | grep '/home/ubuntu/shared' | sed -rn 's/:(.*)\son\s\/home\/ubuntu\/shared.*/\1/p')
      if [[ "$host_dir" =~ ^[a-zA-Z]:.* ]]; then
        # Windows host
        host_dir=$(echo "$host_dir" | sed -re 's/\\/\//g' -e 's/(.*):/\/mnt\/\1/')
      fi
      host_dir=$(echo $host_dir | sed -re 's/\s/\\ /g')
      if [ -z "${host_dir}" ]; then
        echo -e "\n\033[1;31m$top\n$middle\n$t1\n$t2\n$middle\n$bottom\033[0m\n"
      fi
      export WEBOTS_SHARED_FOLDER="$host_dir/webots":/home/ubuntu/shared/webots
    else
      echo -e "\n\033[1;31m$top\n$middle\n$t1\n$t2\n$middle\n$bottom\033[0m\n"
    fi
  path: /home/ubuntu/.bashrc
  owner: ubuntu:ubuntu
  append: true
  defer: true

runcmd:
- echo "Creating ~/.config directory"
- [ su, ubuntu, -c, mkdir /home/ubuntu/.config ]
- echo "Creating ROS workspace"
- [ su, ubuntu, -c, mkdir -p /home/ubuntu/ros2_ws/src ]
- echo "Creating Python virtual environment"
- [ su, ubuntu, -c, python3 -m venv /home/ubuntu/ros2_ws/venv --system-site-packages ]
- [ su, ubuntu, -c, touch /home/ubuntu/ros2_ws/venv/COLCON_IGNORE ]
- echo "Installing PIP packages"
- [ su, ubuntu, -c, source /home/ubuntu/ros2_ws/venv/bin/activate && python3 -m pip install --upgrade pip && python3 -m pip install -r https://raw.githubusercontent.com/KTH-RPL/wasp_autonomous_systems/refs/heads/ht25/requirements.txt && deactivate ]
- echo "Cloning course repository"
- [ su, ubuntu, -c, git clone --recurse-submodules https://github.com/KTH-RPL/wasp_autonomous_systems.git -b ht25 /home/ubuntu/ros2_ws/src/wasp_autonomous_systems ]
- echo "Building ROS workspace"
- [ su, ubuntu, -c, source /home/ubuntu/ros2_ws/venv/bin/activate && cd /home/ubuntu/ros2_ws && source /opt/ros/jazzy/setup.bash && python3 -m colcon build --symlink-install --packages-up-to-regex assignment && deactivate ]
- echo "Setup completed"

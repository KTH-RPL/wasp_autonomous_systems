- content: |
    #!/bin/bash

    header="┏━━━━━━━━━━━━━━━━━  \e[5m\e[4mPLEASE NOTE\e[24m\e[25m ━━━━━━━━━━━━━━━━━┓"
    filler="┃                                                ┃"
    footer="┗━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━┛"
    text_1="┃         Cannot find shared directory.          ┃"
    text_2="┃         Please mount shared directory.         ┃"
    text_3="┃         \033[1;34m\e]8;;https://github.com/KTH-RPL/wasp_autonomous_systems/wiki/Setup-Multipass-VM#create-and-mount-shared-directory\aLink to Wiki for instructions\e]8;;\a\033[1;31m          ┃"
    
    if [ -d /home/ubuntu/shared ]; then
      host_dir=$(mount | grep '/home/ubuntu/shared' | sed -rn 's/:(.*)\son\s\/home\/ubuntu\/shared.*/\1/p')
      if [[ "$host_dir" =~ ^[a-zA-Z]:.* ]]; then
        # Windows host
        host_dir=$(echo "$host_dir" | sed -re 's/\\/\//g' -e 's/(.*):/\/mnt\/\1/')
      fi
      host_dir=$(echo $host_dir | sed -re 's/\s/\\ /g')
    
      if [ -z "${host_dir}" ]; then
        echo -e "\n\033[1;31m$header\n$filler\n$text_1\n$text_2\n$filler\n$text_3\n$filler\n$footer\033[0m\n"
      else
        echo "Extracting rosbags"
        cd /home/ubuntu/shared
        pv /home/ubuntu/rosbags.tar.zst | tar -I "unzstd -T0" -x
        cd rosbags
        echo "Verifying checksums"
        if md5sum -c /home/ubuntu/rosbags_md5sums.txt; then
          echo -e "\033[1;32m✅ Successfully extracted the rosbags! ✅\033[0m"
        else
          echo -e "\033[1;31m❌ Failed to extract the rosbags! ❌\033[0m"
        fi
      fi
    else
      echo -e "\n\033[1;31m$header\n$filler\n$text_1\n$text_2\n$filler\n$text_3\n$filler\n$footer\033[0m\n"
    fi
  path: /home/ubuntu/extract_rosbags.bash
  owner: ubuntu:ubuntu
  permissions: '0755'
  defer: true

- content: |
    Created ~/.config directory:          WAIT ⚠️
    Cloning course repository:            WAIT ⚠️
    Created Python virtual environment:   WAIT ⚠️
    Activated Python virtual environment: WAIT ⚠️
    Installed PIP packages:               WAIT ⚠️
    Downloaded and exported YOLO models:  WAIT ⚠️
    Built ROS workspace:                  WAIT ⚠️
    Installed course Assignment 1:        WAIT ⚠️
    Installed course Assignment 2:        WAIT ⚠️
    Installed course Assignment 3:        WAIT ⚠️
    Installed course Assignment 4:        WAIT ⚠️
    Downloaded rosbags:                   WAIT ⚠️
    Verified downloaded rosbags:          WAIT ⚠️
  path: /home/ubuntu/setup.log
  owner: ubuntu:ubuntu
  defer: true

- content: |
    #!/bin/bash

    function cleanup {
      sed -i "s/WAIT ⚠️/FAIL ❌ \[Never executed\]/g" $log_file
    }

    trap cleanup EXIT

    log_file=$1

    log_info()
    {
      local start=$EPOCHREALTIME

      eval "$@"
      ret=$?

      local end=$EPOCHREALTIME
      local duration=$(echo "scale=2;($end-$start)/1" | bc)

      if [ $ret -eq 0 ]; then
        sed -i "0,/WAIT ⚠️/s//PASS ✅ \[$duration s\]/" $log_file
      else
        sed -i "0,/WAIT ⚠️/s//FAIL ❌ \[$duration s\] \[Error code: $ret\]/" $log_file

        # Terminate the script early
        exit $ret
      fi
    }

    # Download rosbags in background    
    curl -L -C - https://canvas.kth.se/files/9471655/download\?download_frd\=1\&verifier\=4wOMCwu3QHS0duQGTKpn6HyhO9jCPGZSL3RM9kmu --output /home/ubuntu/rosbags.tar.zst &
    ROSBAGS_DOWNLOAD_PID=$!
    
    log_info "mkdir /home/ubuntu/.config"
    
    log_info "git clone --recurse-submodules https://github.com/KTH-RPL/wasp_autonomous_systems.git -b ht25 /home/ubuntu/ros2_ws/src/wasp_autonomous_systems"

    log_info "python3 -m venv /home/ubuntu/ros2_ws/venv --system-site-packages && touch /home/ubuntu/ros2_ws/venv/COLCON_IGNORE"
    
    log_info ". /home/ubuntu/ros2_ws/venv/bin/activate"
    
    log_info "python3 -m pip install --upgrade pip && python3 -m pip install -r /home/ubuntu/ros2_ws/src/wasp_autonomous_systems/requirements.txt"
    
    mkdir /home/ubuntu/yolo_models

    log_info "cd /home/ubuntu/yolo_models && yolo segment export model=yolo11n-seg.pt format=openvino half=True device=cpu dynamic=True && yolo segment export model=yolo11n-seg.pt format=openvino int8=True device=cpu dynamic=True data=coco128-seg.yaml"
    
    log_info ". /opt/ros/jazzy/setup.bash && cd /home/ubuntu/ros2_ws && python3 -m colcon build --cmake-args -DCMAKE_BUILD_TYPE=Release --symlink-install --packages-up-to-regex assignment"

    for i in 1 2 3 4; do
      log_info "test -d '/home/ubuntu/ros2_ws/install/assignment_$i'"
    done

    log_info "wait $ROSBAGS_DOWNLOAD_PID"

    log_info "echo db0c7fe93e4b78649c95a5f5b4e7dec4  /home/ubuntu/rosbags.tar.zst | md5sum -c -"

  path: /home/ubuntu/wasp_setup.bash
  owner: ubuntu:ubuntu
  permissions: '0755'
  defer: true

runcmd:
- [ su, ubuntu, -c, "/home/ubuntu/wasp_setup.bash /home/ubuntu/setup.log" ]
- chown root:root /home/ubuntu/setup.log
- rm /home/ubuntu/wasp_setup.bash

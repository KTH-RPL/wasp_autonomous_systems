[package.build.backend]
channels = [
  "https://prefix.dev/pixi-build-backends",
  "https://prefix.dev/conda-forge",
]
name = "pixi-build-ros"
version = "*"

[[package.build.config.extra-package-mappings]]
python3-ultralytics-pip = { conda = ["ultralytics"] }
python3-transforms3d = { conda = ["transforms3d"] }
python3-pyqtgraph = { conda = ["pyqtgraph"] }

# See src/webots_ros2_driver/pixi.toml for why this mutex pin exists.
[package.host-dependencies]
ros2-distro-mutex = ">=0.13,<0.14"

[package.build-dependencies]
ros2-distro-mutex = ">=0.13,<0.14"

[package.run-dependencies]
ros2-distro-mutex = ">=0.13,<0.14"
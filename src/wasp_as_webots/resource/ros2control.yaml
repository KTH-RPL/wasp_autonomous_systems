controller_manager:
  ros__parameters:
    update_rate: 60

    diffdrive_controller:
      type: diff_drive_controller/DiffDriveController

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

diffdrive_controller:
  ros__parameters:
    left_wheel_names: ["wheel_left_motor"]
    right_wheel_names: ["wheel_right_motor"]

    wheel_separation: 0.16
    wheel_radius: 0.033

    # The real separation between wheels is not resulting in a perfect odometry
    wheel_separation_multiplier: 1.112

    # Jazzy's diff_drive_controller removed use_stamped_vel entirely - it
    # always publishes/subscribes ~/cmd_vel as geometry_msgs/TwistStamped
    # now, no more unstamped cmd_vel_unstamped variant.
    base_frame_id: "base_link"
